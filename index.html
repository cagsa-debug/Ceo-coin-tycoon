<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coin Smash 🪙</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       MENU UTAMA
  ========================== -->

  <div id="homeScreen" class="screen">

    <div class="logo">
      🪙
    </div>

    <h1>COIN SMASH</h1>

    <p class="subtitle">
      Tangkap coin sebanyak-banyaknya!
    </p>


    <div class="login-card">

      <h2>🎮 Mulai Bermain</h2>

      <input
        type="text"
        id="username"
        placeholder="Masukkan Username"
        maxlength="20"
      >

      <input
        type="tel"
        id="phone"
        placeholder="Masukkan Nomor WA"
        maxlength="15"
      >

      <button
        id="startBtn"
        class="main-btn"
      >
        🚀 MULAI GAME
      </button>

      <button
        id="leaderboardBtn"
        class="secondary-btn"
      >
        🏆 LEADERBOARD
      </button>

    </div>

  </div>


  <!-- =========================
       GAME
  ========================== -->

  <div id="gameScreen" class="screen hidden">

    <div class="game-top">

      <div class="info-box">

        <span>⭐ SCORE</span>

        <strong id="score">
          0
        </strong>

      </div>


      <div class="info-box">

        <span>⏱️ WAKTU</span>

        <strong id="timer">
          60
        </strong>

      </div>


      <div class="info-box">

        <span>🔥 COMBO</span>

        <strong id="combo">
          0
        </strong>

      </div>

    </div>


    <div
      id="gameArea"
      class="game-area"
    >

      <div
        id="startMessage"
        class="game-message"
      >

        <h2>🪙 SIAP?</h2>

        <p>
          Tap coin untuk mendapatkan poin!
        </p>

      </div>

    </div>


    <button
      id="quitBtn"
      class="quit-btn"
    >
      ⏹️ Keluar
    </button>

  </div>


  <!-- =========================
       GAME OVER
  ========================== -->

  <div
    id="gameOverScreen"
    class="screen hidden"
  >

    <div class="result-card">

      <div class="trophy">
        🏆
      </div>

      <h1>
        GAME SELESAI!
      </h1>

      <p>
        Skor kamu:
      </p>

      <div
        id="finalScore"
        class="final-score"
      >
        0
      </div>

      <p id="resultMessage">
        Hebat!
      </p>


      <button
        id="playAgainBtn"
        class="main-btn"
      >
        🔄 MAIN LAGI
      </button>


      <button
        id="homeBtn"
        class="secondary-btn"
      >
        🏠 MENU UTAMA
      </button>

    </div>

  </div>


  <!-- =========================
       LEADERBOARD
  ========================== -->

  <div
    id="leaderboardScreen"
    class="screen hidden"
  >

    <div class="leaderboard-card">

      <h1>
        🏆 LEADERBOARD
      </h1>

      <p>
        10 skor terbaik
      </p>


      <div
        id="leaderboardList"
        class="leaderboard-list"
      >

        <div class="loading">
          Memuat leaderboard...
        </div>

      </div>


      <button
        id="backHomeBtn"
        class="secondary-btn"
      >
        🏠 KEMBALI
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
